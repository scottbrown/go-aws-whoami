name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' is not a semantic version (vX.Y.Z[-pre])" >&2
            exit 1
          fi
      - name: Checkout Source
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Run unit tests
        run: task check
      - name: Compile all versions
        run: task release VERSION="${GITHUB_REF_NAME}"
      - name: Generate SBOM
        uses: CycloneDX/gh-gomod-generate-sbom@v2.0.0
        with:
          version: v1
          args: mod -licenses -json -output .build/dist/bom.json
      - name: Create Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          generate_release_notes: true
          files: |
            .build/dist/*.tar.gz
            .build/dist/checksums.txt
            .build/dist/bom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
